# Aplicado automaticamente pelo "docker compose" em desenvolvimento local.
# NÃO é usado pelo Portainer (que lê apenas o docker-compose.yml).
# Adiciona o bind-mount do código-fonte para hot-reload no runserver.
services:
  web:
    volumes:
      - .:/app
      - staticfiles:/app/staticfiles
  celery_worker:
    volumes:
      - .:/app
